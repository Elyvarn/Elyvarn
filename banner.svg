<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', monospace">
  <defs>
    <style>
      .lbl { fill: #7d8590; font-size: 13px; }
      .val { fill: #d8ffe0; font-size: 13px; font-weight: bold; }
      .hdr { fill: #39ff77; font-size: 15px; font-weight: bold; letter-spacing: 1px; }
      .dot { stroke: #2a3a30; stroke-width: 1.5; stroke-dasharray: 1,3; }
      .sub { fill: #56d364; font-size: 11px; }
    </style>
  </defs>

  <!-- window -->
  <rect x="1" y="1" width="898" height="518" rx="10" fill="#0a0e0b" stroke="#213127" stroke-width="1.5"/>

  <!-- title bar -->
  <rect x="1" y="1" width="898" height="34" rx="10" fill="#0d1410"/>
  <circle cx="24" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="44" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="64" cy="18" r="6" fill="#27c93f"/>
  <text x="450" y="22" text-anchor="middle" class="sub" fill="#5c6b62">elyvarn@github: ~/profile — ./system.live</text>
  <circle cx="852" cy="18" r="4" fill="#ff5f56"/>
  <text x="862" y="22" class="sub" fill="#ff8a80">LIVE</text>

  <!-- left panel: visual map -->
  <text x="30" y="65" class="hdr" font-size="12">VISUAL.MAP</text>
  <rect x="30" y="78" width="330" height="400" rx="6" fill="#0c1310" stroke="#1c2a21"/>

  <!-- stylized shield / lock built from dots, cybersecurity theme -->
  <g fill="#39ff77" opacity="0.85">
    <!-- generated dot-grid shield silhouette -->
    <g id="shield-dots">
      <!-- outline rows approximating a shield shape -->
      <circle cx="195" cy="140" r="2"/><circle cx="215" cy="140" r="2"/><circle cx="175" cy="140" r="2"/>
      <circle cx="155" cy="150" r="2"/><circle cx="235" cy="150" r="2"/>
      <circle cx="140" cy="165" r="2"/><circle cx="250" cy="165" r="2"/>
      <circle cx="130" cy="185" r="2"/><circle cx="260" cy="185" r="2"/>
      <circle cx="125" cy="205" r="2"/><circle cx="265" cy="205" r="2"/>
      <circle cx="123" cy="225" r="2"/><circle cx="267" cy="225" r="2"/>
      <circle cx="125" cy="245" r="2"/><circle cx="265" cy="245" r="2"/>
      <circle cx="130" cy="265" r="2"/><circle cx="260" cy="265" r="2"/>
      <circle cx="140" cy="285" r="2"/><circle cx="250" cy="285" r="2"/>
      <circle cx="155" cy="303" r="2"/><circle cx="235" cy="303" r="2"/>
      <circle cx="170" cy="318" r="2"/><circle cx="220" cy="318" r="2"/>
      <circle cx="185" cy="330" r="2"/><circle cx="205" cy="330" r="2"/>
      <circle cx="195" cy="338" r="2.5"/>
      <!-- inner lock body -->
      <rect x="165" y="215" width="60" height="55" rx="6" fill="none" stroke="#39ff77" stroke-width="2"/>
      <path d="M175 215 v-20 a20 20 0 0 1 40 0 v20" fill="none" stroke="#39ff77" stroke-width="2"/>
      <circle cx="195" cy="240" r="6" fill="#39ff77"/>
      <rect x="192" y="240" width="6" height="16" fill="#39ff77"/>
      <!-- scattered noise dots for ascii texture -->
      <circle cx="90" cy="120" r="1.3" opacity="0.5"/><circle cx="310" cy="130" r="1.3" opacity="0.5"/>
      <circle cx="75" cy="180" r="1.3" opacity="0.4"/><circle cx="320" cy="200" r="1.3" opacity="0.4"/>
      <circle cx="80" cy="260" r="1.3" opacity="0.5"/><circle cx="305" cy="280" r="1.3" opacity="0.5"/>
      <circle cx="100" cy="330" r="1.3" opacity="0.4"/><circle cx="290" cy="340" r="1.3" opacity="0.4"/>
      <circle cx="150" cy="400" r="1.3" opacity="0.3"/><circle cx="240" cy="410" r="1.3" opacity="0.3"/>
    </g>
  </g>
  <text x="195" y="450" text-anchor="middle" class="sub" font-size="11" fill="#3d4d42">[ SECURE // ENCRYPTED ]</text>

  <!-- right panel: system info -->
  <text x="390" y="65" class="hdr">SYSTEM.INFO</text>
  <rect x="390" y="76" width="240" height="20" rx="3" fill="#0c1712" stroke="#1c2a21"/>
  <text x="398" y="90" class="sub" fill="#4fa870" font-size="11">contact.elyvarn@proton.me</text>

  <!-- rows -->
  <g>
    <text x="390" y="122" class="lbl">Subject</text>
    <line x1="470" y1="118" x2="740" y2="118" class="dot"/>
    <text x="870" y="122" text-anchor="end" class="val">Elyvarn</text>

    <text x="390" y="144" class="lbl">Role</text>
    <line x1="470" y1="140" x2="740" y2="140" class="dot"/>
    <text x="870" y="144" text-anchor="end" class="val">Cybersecurity Student</text>

    <text x="390" y="166" class="lbl">Education</text>
    <line x1="470" y1="162" x2="740" y2="162" class="dot"/>
    <text x="870" y="166" text-anchor="end" class="val">University Student</text>

    <text x="390" y="188" class="lbl">Status</text>
    <line x1="470" y1="184" x2="740" y2="184" class="dot"/>
    <text x="870" y="188" text-anchor="end" class="val">Learning + Building + Researching</text>

    <text x="390" y="210" class="lbl">Experience</text>
    <line x1="470" y1="206" x2="740" y2="206" class="dot"/>
    <text x="870" y="210" text-anchor="end" class="val">Hands-on Projects &amp; CTFs</text>
  </g>

  <line x1="390" y1="228" x2="870" y2="228" stroke="#1c2a21" stroke-width="1"/>

  <g>
    <text x="390" y="252" class="lbl">Core.Lang</text>
    <line x1="470" y1="248" x2="740" y2="248" class="dot"/>
    <text x="870" y="252" text-anchor="end" class="val">C, C++, Python, Go, JS</text>

    <text x="390" y="274" class="lbl">Core.Platform</text>
    <line x1="470" y1="270" x2="740" y2="270" class="dot"/>
    <text x="870" y="274" text-anchor="end" class="val">Linux, Windows, macOS</text>

    <text x="390" y="296" class="lbl">Core.Focus</text>
    <line x1="470" y1="292" x2="740" y2="292" class="dot"/>
    <text x="870" y="296" text-anchor="end" class="val">Web Sec, Offensive Sec, RE</text>

    <text x="390" y="318" class="lbl">Core.Practice</text>
    <line x1="470" y1="314" x2="740" y2="314" class="dot"/>
    <text x="870" y="318" text-anchor="end" class="val">CTFs, Labs, Malware Research</text>
  </g>

  <line x1="390" y1="336" x2="870" y2="336" stroke="#1c2a21" stroke-width="1"/>
  <text x="390" y="360" class="lbl" fill="#5c6b62">- Contact</text>

  <g>
    <text x="390" y="384" class="lbl">Grid.Mail</text>
    <line x1="480" y1="380" x2="700" y2="380" class="dot"/>
    <text x="870" y="384" text-anchor="end" class="val" font-size="12">your-email@example.com</text>

    <text x="390" y="406" class="lbl">Grid.GitHub</text>
    <line x1="480" y1="402" x2="700" y2="402" class="dot"/>
    <text x="870" y="406" text-anchor="end" class="val">@Elyvarn</text>

    <text x="390" y="428" class="lbl">Grid.Twitter</text>
    <line x1="480" y1="424" x2="700" y2="424" class="dot"/>
    <text x="870" y="428" text-anchor="end" class="val">@your_handle</text>
  </g>

  <text x="390" y="470" class="sub" fill="#3d4d42">• More about me &amp; projects below in README ▍</text>
</svg>
